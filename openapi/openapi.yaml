openapi: 3.0.3
info:
  title: VibeCollector
  version: 0.1.0
  description: |
    JSON API for the VibeCollector NetFlow collector.
    Collected flows and aggregates are read with GET. There is no write API for them.

    Access tokens travel only in the `Authorization: Bearer` header.
    The query string is not a token channel.
    Every REST route, including health, requires a bearer token with scope `read`.
    A missing or rejected token is 401 on every bind, including loopback.

    The REST mount is `http.api_prefix`, default `/api/v1`.
    The nine data paths in this document use that default.
    When the daemon serves this document it rewrites those `/api/v1` path keys
    to the configured prefix, under the path of `http.public_host`.
    `/oauth/authorize`, `/oauth/token`, and `/openapi.json` are mounted on that
    same path. An empty public path leaves them at the site root.

    Range routes take `start` and `end` (RFC 3339 UTC, half-open `[start, end)`)
    or `day=YYYY-MM-DD` with an IANA `tz` (default `UTC`).
    If both styles are present, `day` wins.
    Every range response echoes `start`, `end`, `tz`, and `boundary_adjusted`.
    A repeated local time uses the earlier instant.
    A skipped civil time moves to the next valid instant and sets `boundary_adjusted`.

    Integer counts that can exceed 2^53 are decimal strings, not JSON numbers.
    Stored octets and packets are never multiplied by the sampling interval.

    `Cache-Control: no-store` bypasses the hot-query cache.
    `filter_outside_raw` and `query_timeout` are not cached as success.
    Unknown paths are 404. CORS is off.
servers:
  - url: http://127.0.0.1:8080
    description: |
      Daemon HTTP listener. REST routes are mounted at `http.api_prefix`
      (default `/api/v1`) under the path of `http.public_host`.
      This document writes those paths at the default, on the site root.
      The served copy uses the configured prefix and public path.
      When `http.public_host` or `oauth2.issuer` names an origin, the served
      copy uses that origin. OAuth2 and this document use the same public path.
tags:
  - name: status
    description: Process and exporter health. These routes do not take a time range.
  - name: query
    description: Flows and aggregates for one shared time range.
  - name: oauth
    description: OAuth 2.0 authorization code with PKCE, refresh tokens, and client credentials.
  - name: discovery
    description: This API document.
security:
  - oauth2: [read]
paths:
  /api/v1/health:
    get:
      tags: [status]
      operationId: getHealth
      summary: Process check
      description: |
        Reports that the process is serving. It does not read flows or exporters.
      security: [{ oauth2: [read] }]
      parameters:
        - $ref: "#/components/parameters/CacheControl"
      responses:
        "200":
          description: The process is serving.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/stats:
    get:
      tags: [status]
      operationId: getStats
      summary: Process-lifetime counters
      description: |
        Every process counter, including zeros. Values are not reset on read and are not paged.
        Per-exporter totals are `GET /api/v1/exporters`, not this object.
        Sequence reorder, duplicate, reset, and unresolved, and `count_disagrees`,
        `padding_nonzero`, and `reserved_set`, exist only here.
      security: [{ oauth2: [read] }]
      parameters:
        - $ref: "#/components/parameters/CacheControl"
      responses:
        "200":
          description: Counter snapshot. Every key is present.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
              example:
                udp_received_packets: 0
                udp_received_bytes: 0
                decoded_packets: 0
                decoded_flows: 0
                dropped_queue: 0
                dropped_enrich_queue: 0
                dropped_writer_queue: 0
                dropped_template: 0
                dropped_disk: 0
                malformed: 0
                missing_template: 0
                templates_withdrawn: 0
                withdraw_unknown: 0
                template_redefined: 0
                template_idle_expired: 0
                template_evicted: 0
                reserved_set: 0
                count_disagrees: 0
                padding_nonzero: 0
                sequence_gap_v5_flows: 0
                sequence_gap_v9_packets: 0
                sequence_gap_ipfix_records: 0
                sequence_reorder: 0
                sequence_duplicate: 0
                sequence_reset: 0
                sequence_unresolved: 0
                non_flow_records: 0
                timestamp_skew: 0
                timestamp_suspect: 0
                timestamp_export_fallback: 0
                clock_clamped: 0
                enrich_geoip_not_configured: 0
                enrich_geoip_no_data: 0
                enrich_geoip_error: 0
                enrich_geoip_value: 0
                enrich_geoip_skipped: 0
                enrich_asn_not_configured: 0
                enrich_asn_no_data: 0
                enrich_asn_error: 0
                enrich_asn_value: 0
                enrich_asn_skipped: 0
                enrich_reputation_not_configured: 0
                enrich_reputation_no_data: 0
                enrich_reputation_error: 0
                enrich_reputation_value: 0
                enrich_reputation_skipped: 0
                sqlite_write_failures: 0
                sqlite_rows_written: 0
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/exporters:
    get:
      tags: [status]
      operationId: getExporters
      summary: Exporter rows
      description: |
        Durable exporter state. No time range and no flow filter.
        `last_seen` is the last packet time.
        `malformed`, `missing_template`, `gap_flows`, `gap_packets`, and `gap_records`
        are separate totals. The three gap counters are not summed.
        `version` 0 and `domain` 0 mean the header did not yield a version.
        A read that exceeds 5 seconds is 503 `query_timeout`, not a partial list.
      security: [{ oauth2: [read] }]
      parameters:
        - $ref: "#/components/parameters/CacheControl"
      responses:
        "200":
          description: Exporter rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exporters"
              example:
                exporters:
                  - exporter: 192.0.2.9
                    domain: 0
                    version: 0
                    last_seen: "2026-11-09T12:00:01Z"
                    packets: 1
                    flows: 0
                    malformed: 1
                    missing_template: 0
                    gap_flows: 0
                    gap_packets: 0
                    gap_records: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/QueryTimeout"

  /api/v1/flows:
    get:
      tags: [query]
      operationId: getFlows
      summary: Flow table page
      description: |
        One keyset page of raw flows. This route always reads `flows`.
        Every common filter is native.
        `reputation` is a case-sensitive category substring on either end,
        not the equality match used by `GET /api/v1/reputation`.
        `port`, `src_port`, and `dst_port` are all bound when set.

        The top-level `start`, `end`, `tz`, and `boundary_adjusted` are the query window.
        Each flow's `start` and `end` are that flow's times.

        `packets` and `octets` are decimal strings of the exported counters.
        They are not multiplied by `sampling_interval`.
        The body has no estimated-total field.
        `sampling_interval` is N when the flow is sampled, and null or absent when it is not.
        `sampling_algorithm` is present when the export carried one.
        `bgp_src_as` and `bgp_dst_as` are present when the export carried them.
        Outcome fields are `not_configured`, `no_data`, `error`, `value`, or `skipped`.

        Pagination is a keyset, not an offset.
        `next_cursor` is `base64.RawURLEncoding` of the ASCII bytes of `{flow_start_ms},{id}`.
        The example cursor is that encoding of `1794182400000,42`.
        Pass it back as `cursor`. The server decodes it to two integers and binds them.
        An empty `next_cursor` means there is no next page.
        `limit` defaults to 100 and cannot exceed 500.

        When `start` is older than raw retention the status is 200, `flows` is empty,
        `truncated` is true, and `raw_available_from` is set.
        This route does not return `filter_outside_raw`.
        A read that exceeds 5 seconds is 503 `query_timeout`.
      security: [{ oauth2: [read] }]
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Day"
        - $ref: "#/components/parameters/Tz"
        - $ref: "#/components/parameters/Src"
        - $ref: "#/components/parameters/Dst"
        - $ref: "#/components/parameters/Port"
        - $ref: "#/components/parameters/SrcPort"
        - $ref: "#/components/parameters/DstPort"
        - $ref: "#/components/parameters/Proto"
        - $ref: "#/components/parameters/Exporter"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Asn"
        - $ref: "#/components/parameters/Reputation"
        - $ref: "#/components/parameters/Sampled"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/LimitFlows"
        - $ref: "#/components/parameters/CacheControl"
      responses:
        "200":
          description: |
            One page. `truncated` is true and `flows` is empty when `start` is before raw retention.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowPage"
              examples:
                page:
                  summary: One keyset page
                  value:
                    start: "2026-11-09T00:00:00Z"
                    end: "2026-11-09T01:00:00Z"
                    tz: UTC
                    boundary_adjusted: false
                    raw_available_from: "2026-11-08T18:00:00Z"
                    truncated: false
                    flows:
                      - id: 42
                        start: "2026-11-09T00:00:00Z"
                        end: "2026-11-09T00:00:01Z"
                        exporter: 192.0.2.1
                        domain: 0
                        version: 5
                        src: 203.0.113.5
                        dst: 198.51.100.9
                        src_port: 443
                        dst_port: 51000
                        proto: 6
                        packets: "10"
                        octets: "1000"
                        counter_semantics: delta
                        octet_semantics: ip
                        flow_direction: 0
                        sampled: false
                        clock_clamped: false
                        bgp_src_as: 64496
                        src_scope: global
                        dst_scope: private
                        src_geo: not_configured
                        dst_geo: skipped
                        src_asn: not_configured
                        dst_asn: skipped
                        src_rep: not_configured
                        dst_rep: skipped
                    next_cursor: MTc5NDE4MjQwMDAwMCw0Mg
                before_raw_retention:
                  summary: start is older than raw retention
                  value:
                    start: "2026-11-01T00:00:00Z"
                    end: "2026-11-01T01:00:00Z"
                    tz: UTC
                    boundary_adjusted: false
                    raw_available_from: "2026-11-09T06:00:00Z"
                    truncated: true
                    flows: []
                    next_cursor: ""
        "400":
          $ref: "#/components/responses/BadRange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/QueryTimeout"

  /api/v1/timeseries:
    get:
      tags: [query]
      operationId: getTimeseries
      summary: Traffic over time
      description: |
        Exported octets and packets over the range, split by `sampled`.
        Values are not estimates and are not multiplied by the sampling interval.

        Native filters are `exporter`, `proto` (`ip_proto`, `-1` when the record had no protocol),
        and `sampled`.
        `src`, `dst`, `port`, `src_port`, `dst_port`, `country`, `asn`, and `reputation` are unsupported.
        `port`, `src_port`, and `dst_port` stay unsupported when more than one of them is set.

        If every active filter is native, `source` is `rollup`.
        Sampled and unsampled traffic stay in separate series.
        If an unsupported filter is set and `start` is inside raw retention,
        the route aggregates eligible flows and `source` is `flows`.
        `total` and `l4_payload` rows are not part of the summed octets.
        If an unsupported filter is set and `start` is before raw retention,
        the response is 400 `filter_outside_raw`. The filter is not dropped.

        Without `sampled`, `series` has both values.
        With `sampled=true` or `sampled=false`, `series` has that one value.
        `grain` is `1m` when the range is at most 7 days, and `1h` when a rollup range is longer.
        A `source` of `flows` stays at `1m`.
        A read that exceeds 5 seconds is 503 `query_timeout`, not a partial body and not the unfiltered rollup.
      security: [{ oauth2: [read] }]
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Day"
        - $ref: "#/components/parameters/Tz"
        - $ref: "#/components/parameters/Src"
        - $ref: "#/components/parameters/Dst"
        - $ref: "#/components/parameters/Port"
        - $ref: "#/components/parameters/SrcPort"
        - $ref: "#/components/parameters/DstPort"
        - $ref: "#/components/parameters/Proto"
        - $ref: "#/components/parameters/Exporter"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Asn"
        - $ref: "#/components/parameters/Reputation"
        - $ref: "#/components/parameters/Sampled"
        - $ref: "#/components/parameters/CacheControl"
      responses:
        "200":
          description: One series per sampled value in the result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeseries"
              example:
                source: rollup
                grain: 1m
                start: "2026-11-09T12:00:00Z"
                end: "2026-11-09T13:00:00Z"
                tz: UTC
                boundary_adjusted: false
                series:
                  - sampled: false
                    points:
                      - t: "2026-11-09T12:00:00Z"
                        octets: "1000"
                        packets: "10"
                  - sampled: true
                    points:
                      - t: "2026-11-09T12:00:00Z"
                        octets: "40"
                        packets: "1"
        "400":
          $ref: "#/components/responses/BadQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/QueryTimeout"

  /api/v1/talkers:
    get:
      tags: [query]
      operationId: getTalkers
      summary: Top talkers
      description: |
        One direction, ranked by octets. The route does not rank ports.
        `by` is `src` or `dst`, default `src`.

        Native filters are `by`, and an address only when it is `src` with `by=src`
        or `dst` with `by=dst` (equality on `addr`).
        `port`, `src_port`, `dst_port`, `proto`, `exporter`, `country`, `asn`,
        `reputation`, `sampled`, the opposite address, and both addresses are unsupported.
        Unsupported filters use the same flows fallback and `filter_outside_raw` rule
        as `GET /api/v1/timeseries`.

        `other_octets` is the sum of `*` rows in the range.
        It does not overlap a listed address.
        `approximate` is true when that remainder is non-zero.
        `limit` defaults to 100 and cannot exceed 100.
        `grain` is `1m`.
      security: [{ oauth2: [read] }]
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Day"
        - $ref: "#/components/parameters/Tz"
        - $ref: "#/components/parameters/Src"
        - $ref: "#/components/parameters/Dst"
        - $ref: "#/components/parameters/Port"
        - $ref: "#/components/parameters/SrcPort"
        - $ref: "#/components/parameters/DstPort"
        - $ref: "#/components/parameters/Proto"
        - $ref: "#/components/parameters/Exporter"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Asn"
        - $ref: "#/components/parameters/Reputation"
        - $ref: "#/components/parameters/Sampled"
        - $ref: "#/components/parameters/By"
        - $ref: "#/components/parameters/LimitTop"
        - $ref: "#/components/parameters/CacheControl"
      responses:
        "200":
          description: Top addresses for `by`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Talkers"
              example:
                source: rollup
                grain: 1m
                start: "2026-11-09T12:00:00Z"
                end: "2026-11-09T13:00:00Z"
                tz: UTC
                boundary_adjusted: false
                by: src
                approximate: true
                other_octets: "50"
                rows:
                  - addr: 203.0.113.5
                    octets: "1000"
                    packets: "10"
                    flows: 2
        "400":
          $ref: "#/components/responses/BadQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/QueryTimeout"

  /api/v1/asns:
    get:
      tags: [query]
      operationId: getAsns
      summary: ASN breakdown
      description: |
        Autonomous-system totals for the range.
        The native filter is `asn` (the enriched ASN, or the export BGP AS when
        the enriched outcome is not `value`).
        `src`, `dst`, `port`, `src_port`, `dst_port`, `proto`, `exporter`,
        `country`, `reputation`, and `sampled` are unsupported.
        Unsupported filters use the same flows fallback and `filter_outside_raw` rule
        as `GET /api/v1/timeseries`.

        `from_export` true means the row is the export BGP AS, used when the ASN
        provider outcome was not `value`.
        `asn` `-1` is the overflow sentinel and is labeled `other`.
        `name` may be empty.
        `direction` is `src` or `dst`.
        `limit` defaults to 100 and cannot exceed 100.
        `grain` is `1m`.
      security: [{ oauth2: [read] }]
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Day"
        - $ref: "#/components/parameters/Tz"
        - $ref: "#/components/parameters/Src"
        - $ref: "#/components/parameters/Dst"
        - $ref: "#/components/parameters/Port"
        - $ref: "#/components/parameters/SrcPort"
        - $ref: "#/components/parameters/DstPort"
        - $ref: "#/components/parameters/Proto"
        - $ref: "#/components/parameters/Exporter"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Asn"
        - $ref: "#/components/parameters/Reputation"
        - $ref: "#/components/parameters/Sampled"
        - $ref: "#/components/parameters/LimitTop"
        - $ref: "#/components/parameters/CacheControl"
      responses:
        "200":
          description: ASN rows for the range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ASNs"
              example:
                source: rollup
                grain: 1m
                start: "2026-11-09T12:00:00Z"
                end: "2026-11-09T13:00:00Z"
                tz: UTC
                boundary_adjusted: false
                rows:
                  - asn: 64496
                    name: ""
                    direction: src
                    from_export: true
                    octets: "1000"
                    packets: "10"
                    flows: 2
        "400":
          $ref: "#/components/responses/BadQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/QueryTimeout"

  /api/v1/reputation:
    get:
      tags: [query]
      operationId: getReputation
      summary: Reputation hits
      description: |
        Reputation aggregates for the range.
        `reputation` is category equality on the rollup.
        A value that equals no stored category is an empty rollup, not a raw scan.
        Substring match is only `GET /api/v1/flows` and does not by itself select
        the flows fallback on this route.

        `src`, `dst`, `port`, `src_port`, `dst_port`, `proto`, `exporter`,
        `country`, `asn`, and `sampled` are unsupported.
        Those unsupported filters use the same flows fallback and `filter_outside_raw` rule
        as `GET /api/v1/timeseries`.

        `other_octets` is the OTHER remainder (`addr` `*` and category `*`).
        It does not overlap a listed row.
        `approximate` is true when that remainder is non-zero.
        `limit` defaults to 100 and cannot exceed 100.
        `grain` is `1m`.
      security: [{ oauth2: [read] }]
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Day"
        - $ref: "#/components/parameters/Tz"
        - $ref: "#/components/parameters/Src"
        - $ref: "#/components/parameters/Dst"
        - $ref: "#/components/parameters/Port"
        - $ref: "#/components/parameters/SrcPort"
        - $ref: "#/components/parameters/DstPort"
        - $ref: "#/components/parameters/Proto"
        - $ref: "#/components/parameters/Exporter"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Asn"
        - $ref: "#/components/parameters/Reputation"
        - $ref: "#/components/parameters/Sampled"
        - $ref: "#/components/parameters/LimitTop"
        - $ref: "#/components/parameters/CacheControl"
      responses:
        "200":
          description: Reputation rows for the range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reputation"
              example:
                source: rollup
                grain: 1m
                start: "2026-11-09T12:00:00Z"
                end: "2026-11-09T13:00:00Z"
                tz: UTC
                boundary_adjusted: false
                approximate: false
                other_octets: "0"
                rows:
                  - direction: src
                    addr: 203.0.113.5
                    category: malware
                    octets: "10"
                    packets: "1"
                    flows: 1
        "400":
          $ref: "#/components/responses/BadQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/QueryTimeout"

  /api/v1/geo:
    get:
      tags: [query]
      operationId: getGeo
      summary: Geographic aggregates
      description: |
        Country totals and at most 100 directed paths.
        The flat map and the globe both call this route. It does not know which one called.

        `bytes_are` is `endpoint_touch`. A flow's octets count once per end that has a country,
        so summing countries double-counts a flow with a country on both ends.
        `GET /api/v1/timeseries` is the total that does not double-count.

        The native filter is `country` (country rows, and paths with that country on either end).
        `src`, `dst`, `port`, `src_port`, `dst_port`, `proto`, `exporter`, `asn`,
        `reputation`, and `sampled` are unsupported.
        Unsupported filters use the same flows fallback and `filter_outside_raw` rule
        as `GET /api/v1/timeseries`.

        `paths` is the busiest paths by octets, at most `path_cap` (100).
        `paths_omitted` and `other_octets` report what that cap and the in-memory prune dropped.
        `approximate` is true when any bucket in the range has a non-zero OTHER.
        `kind` is `country`, `city`, or `coord`.
        A city place includes `city`, `region` when present, and `lat`/`lon`.
        A country place omits `lat`/`lon`.
        Coordinates are rounded to one decimal degree.
        `iso_num` is the zero-padded numeric id string used to join world geometry
        (`840`, `016`), not a JSON number.
        Counts on countries and paths are decimal strings.
        Empty `countries` and `paths` are valid when geography is not configured.
        `limit` cannot raise the path cap above 100.
      security: [{ oauth2: [read] }]
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Day"
        - $ref: "#/components/parameters/Tz"
        - $ref: "#/components/parameters/Src"
        - $ref: "#/components/parameters/Dst"
        - $ref: "#/components/parameters/Port"
        - $ref: "#/components/parameters/SrcPort"
        - $ref: "#/components/parameters/DstPort"
        - $ref: "#/components/parameters/Proto"
        - $ref: "#/components/parameters/Exporter"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Asn"
        - $ref: "#/components/parameters/Reputation"
        - $ref: "#/components/parameters/Sampled"
        - $ref: "#/components/parameters/LimitTop"
        - $ref: "#/components/parameters/CacheControl"
      responses:
        "200":
          description: Countries and at most 100 paths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Geo"
              example:
                source: rollup
                start: "2026-11-09T00:00:00Z"
                end: "2026-11-10T00:00:00Z"
                tz: UTC
                boundary_adjusted: false
                bytes_are: endpoint_touch
                approximate: false
                countries:
                  - iso_a2: US
                    iso_num: "840"
                    octets: "1000"
                    packets: "10"
                    flows: "2"
                paths:
                  - src:
                      kind: country
                      iso_a2: US
                    dst:
                      kind: coord
                      iso_a2: DE
                      lat: 50.1
                      lon: 8.6
                    octets: "800"
                    packets: "8"
                    flows: "1"
                path_cap: 100
                paths_omitted: 3
                other_octets: "40"
        "400":
          $ref: "#/components/responses/BadQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/QueryTimeout"

  /oauth/authorize:
    get:
      tags: [oauth]
      operationId: oauthAuthorize
      summary: Authorization code with PKCE
      description: |
        Starts the authorization-code grant with PKCE.
        The web UI sends `client_id` for a client stored in the database, plus
        `code_challenge` and `code_challenge_method` `S256`. The page computes
        that challenge. `code_challenge` is the base64url-encoded SHA-256 digest
        of `code_verifier` without padding. The client secret is not on this URL.
        A caller that omits `code_challenge` and `code_challenge_method` gets a
        daemon-minted verifier and `state`. The daemon stores them in HttpOnly
        cookies `vc_pkce` and `vc_state` (path `/oauth/token`) and redirects to
        `redirect_uri` with `code` and `state`.
        `client_id` is `vibecollector-ui` or a registered client id.
        The code is redeemed at `POST /oauth/token`.
        This route does not accept an access token. `security` is empty so a client
        can start the grant before it has one.
      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          description: Must be `code`.
          schema:
            type: string
            enum: [code]
        - name: client_id
          in: query
          required: true
          description: Client identifier.
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          description: Absolute URI the code is redirected to. It must match the client.
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          required: false
          description: Space-delimited scopes. The only scope is `read`.
          schema:
            type: string
            example: read
        - name: state
          in: query
          required: false
          description: |
            Opaque client value returned unchanged on the redirect.
            Ignored when `code_challenge` is omitted; the daemon generates `state` then.
          schema:
            type: string
        - name: code_challenge
          in: query
          required: false
          description: |
            PKCE challenge. Base64url-encoded SHA-256 of `code_verifier`, without padding.
            Omit it for the UI. The daemon mints the challenge and the verifier.
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: false
          description: |
            PKCE method. `S256` is required when `code_challenge` is sent.
            Omit it when the daemon mints the challenge.
          schema:
            type: string
            enum: [S256]
      responses:
        "302":
          description: |
            Redirect to `redirect_uri` with the authorization `code` and `state`.
            When the daemon minted PKCE, the response also sets `vc_pkce` and `vc_state`.
          headers:
            Location:
              description: |
                `redirect_uri` with `code` and `state`.
              schema:
                type: string
            Set-Cookie:
              description: |
                HttpOnly `vc_pkce` and `vc_state`, path `/oauth/token`, when the daemon minted PKCE.
                The page does not read them.
              schema:
                type: string
        "400":
          description: |
            A required parameter is missing, `response_type` is not `code`,
            or the PKCE challenge method is not `S256`.

  /oauth/token:
    post:
      tags: [oauth]
      operationId: oauthToken
      summary: Exchange a grant for an access token
      description: |
        Issues a bearer access token.
        `grant_type` is `authorization_code`, `refresh_token`, or `client_credentials`.
        The body is `application/x-www-form-urlencoded`, not JSON.

        A confidential client authenticates with HTTP Basic, as required by RFC 6749.
        The username is `client_id` and the password is `client_secret`.
        Each is `application/x-www-form-urlencoded` before the pair is joined with
        `:` and base64-encoded. When Basic carries the pair, those form fields
        may be omitted. The form fields are still accepted. The same pair in both
        places is one authentication. Different values are `invalid_request`.
        A failed attempt that used the `Authorization` header is 401 `invalid_client`
        and includes `WWW-Authenticate: Basic`.

        `authorization_code` requires `code`, `redirect_uri`, and `client_id`.
        When the client sent `code_challenge`, it also sends `code_verifier`.
        The web UI also sends `client_secret` for its registered client.
        When the daemon minted PKCE, the client sends the `vc_pkce` and `vc_state`
        cookies and the form field `state`, and omits `code_verifier`.
        The public client `vibecollector-ui` sends no secret.
        `refresh_token` requires `refresh_token` and `client_id`. A registered
        client also sends `client_secret`. It returns a new access token and a
        new refresh token. The previous refresh token is spent.
        Presenting a spent refresh token revokes that session.
        `client_credentials` requires `client_id` and `client_secret` for a pair
        stored in the database, in Basic or in the form body. It does not return a refresh token.
        Those pairs are not config values.
        Optional `scope` is `read`.

        The response is `access_token`, `token_type` `bearer`, `expires_in`, and `scope` `read`.
        Authorization-code and refresh responses also include `refresh_token`.
        Both values are opaque. The access token is sent only as `Authorization: Bearer`.
        The refresh token is sent only to this route.
        The query string is not a token channel.
        This route does not require an existing access token.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
            examples:
              authorization_code:
                summary: Redeem a PKCE authorization code
                value:
                  grant_type: authorization_code
                  code: example-code
                  redirect_uri: http://127.0.0.1:8080/callback
                  client_id: example-client
                  code_verifier: example-verifier
              client_credentials:
                summary: Client credentials
                value:
                  grant_type: client_credentials
                  client_id: example-client
                  client_secret: example-secret
                  scope: read
              refresh_token:
                summary: Refresh an access token
                value:
                  grant_type: refresh_token
                  refresh_token: example-refresh-token
                  client_id: example-client
                  scope: read
      responses:
        "200":
          description: Bearer access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                access_token: example-token
                token_type: bearer
                expires_in: 3600
                scope: read
                refresh_token: example-refresh-token
        "400":
          description: |
            The grant is malformed, or the code, PKCE verifier, or refresh token was rejected.
            A missing or repeated `grant_type` is `invalid_request`.
            A `grant_type` other than `authorization_code`, `refresh_token`, or `client_credentials` is `unsupported_grant_type`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: invalid_request

  /openapi.json:
    get:
      tags: [discovery]
      operationId: getOpenAPI
      summary: This API document
      description: |
        Returns this OpenAPI 3.0.3 document as JSON.
        No access token is required, so a client can read the contract before it authenticates.
      security: []
      responses:
        "200":
          description: This document, serialized as JSON.
          content:
            application/json:
              schema:
                type: object
                description: The OpenAPI 3.0.3 document served by this daemon.
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        OAuth 2.0 opaque access tokens. The only scope is `read`.
        The UI client refreshes with `grant_type=refresh_token` before `expires_in`.
        Tokens travel only in the `Authorization: Bearer` header.
        The query string is not a token channel.
        A missing or rejected token on a REST route is 401 on every bind.
        Those routes are mounted at `http.api_prefix` (default `/api/v1`).
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            read: read collected flows and aggregates
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            read: read collected flows and aggregates
  parameters:
    CacheControl:
      name: Cache-Control
      in: header
      required: false
      description: |
        `no-store` bypasses the hot-query cache and is not stored.
        `filter_outside_raw` and `query_timeout` are not cached as success.
      schema:
        type: string
    Start:
      name: start
      in: query
      required: false
      description: |
        Range start, RFC 3339 UTC, inclusive.
        The window is half-open `[start, end)`.
        Required on this route unless `day` is set.
        If `day` is also present, `day` wins.
        The response echoes the resolved start.
      schema:
        type: string
        format: date-time
        example: "2026-11-09T12:00:00Z"
    End:
      name: end
      in: query
      required: false
      description: |
        Range end, RFC 3339 UTC, exclusive.
        Required on this route unless `day` is set.
        If `day` is also present, `day` wins.
      schema:
        type: string
        format: date-time
        example: "2026-11-09T13:00:00Z"
    Day:
      name: day
      in: query
      required: false
      description: |
        Calendar day `YYYY-MM-DD`, an alternative to `start` and `end`.
        The server computes midnight-to-midnight in `tz`, half-open.
        A repeated local time uses the earlier instant.
        A skipped civil time moves to the next valid instant and sets `boundary_adjusted`.
        If `start` or `end` is also present, `day` wins.
        A day or timezone the calendar helper cannot resolve is 400 `bad_range`.
      schema:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        example: "2026-11-09"
    Tz:
      name: tz
      in: query
      required: false
      description: |
        IANA time zone used to resolve `day`, and the label echoed on every range response.
        Default `UTC` when omitted. An unresolvable name is 400 `bad_range`.
      schema:
        type: string
        default: UTC
        example: UTC
    Src:
      name: src
      in: query
      required: false
      description: |
        Exact source IP. Prefix search is not a filter.
        Native on `GET /api/v1/flows`.
        On `GET /api/v1/talkers`, native only when `by=src`.
        Unsupported on timeseries, ASNs, reputation, and geo.
      schema:
        type: string
        example: 203.0.113.5
    Dst:
      name: dst
      in: query
      required: false
      description: |
        Exact destination IP. Prefix search is not a filter.
        Native on `GET /api/v1/flows`.
        On `GET /api/v1/talkers`, native only when `by=dst`.
        Unsupported on timeseries, ASNs, reputation, and geo.
      schema:
        type: string
        example: 198.51.100.9
    Port:
      name: port
      in: query
      required: false
      description: |
        Matches the source port or the destination port.
        Native on `GET /api/v1/flows`, including together with `src_port` or `dst_port`.
        Unsupported on every rollup route.
      schema:
        type: integer
        minimum: 0
        maximum: 65535
    SrcPort:
      name: src_port
      in: query
      required: false
      description: |
        Exact source port.
        Native on `GET /api/v1/flows`. Unsupported on every rollup route.
      schema:
        type: integer
        minimum: 0
        maximum: 65535
    DstPort:
      name: dst_port
      in: query
      required: false
      description: |
        Exact destination port.
        Native on `GET /api/v1/flows`. Unsupported on every rollup route.
      schema:
        type: integer
        minimum: 0
        maximum: 65535
    Proto:
      name: proto
      in: query
      required: false
      description: |
        IP protocol number.
        On `GET /api/v1/timeseries`, `-1` selects buckets whose record had no protocol.
        Native on timeseries and flows. Unsupported on talkers, ASNs, reputation, and geo.
      schema:
        type: integer
        minimum: -1
        maximum: 255
    Exporter:
      name: exporter
      in: query
      required: false
      description: |
        Exporter IP, exact.
        Native on timeseries and flows. Unsupported on talkers, ASNs, reputation, and geo.
      schema:
        type: string
        example: 192.0.2.1
    Country:
      name: country
      in: query
      required: false
      description: |
        ISO 3166-1 alpha-2, matched on either end.
        Native on flows and geo (country rows, and paths with that country on either end).
        Unsupported on timeseries, talkers, ASNs, and reputation.
      schema:
        type: string
        minLength: 2
        maxLength: 2
        example: US
    Asn:
      name: asn
      in: query
      required: false
      description: |
        Enriched ASN, or the export BGP AS when the enriched outcome is not `value`.
        Native on flows and ASNs. Unsupported on timeseries, talkers, reputation, and geo.
        The response sentinel `-1` is not a filter value.
      schema:
        type: integer
        minimum: 0
        maximum: 4294967295
    Reputation:
      name: reputation
      in: query
      required: false
      description: |
        On `GET /api/v1/flows`, a case-sensitive category substring on either end.
        On `GET /api/v1/reputation`, category equality.
        A value that matches no category is an empty rollup, not a raw scan.
        Equality does not select the flows fallback.
        Unsupported on timeseries, talkers, ASNs, and geo.
      schema:
        type: string
        example: malware
    Sampled:
      name: sampled
      in: query
      required: false
      description: |
        `true` or `false`.
        On timeseries, the response then contains only that series.
        Omitted, timeseries returns both series.
        Native on timeseries and flows. Unsupported on talkers, ASNs, reputation, and geo.
      schema:
        type: boolean
    By:
      name: by
      in: query
      required: false
      description: |
        Talkers only. Which address to rank. Default `src`.
        An address filter is native only when it matches this direction.
      schema:
        type: string
        enum: [src, dst]
        default: src
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Keyset cursor from `next_cursor`. Not an offset and not a SQL fragment.
        It is `base64.RawURLEncoding` of the ASCII bytes of `{flow_start_ms},{id}`
        (no padding). The server decodes that text to two integers and binds them.
        `MTc5NDE4MjQwMDAwMCw0Mg` is `1794182400000,42`.
      schema:
        type: string
        example: MTc5NDE4MjQwMDAwMCw0Mg
    LimitFlows:
      name: limit
      in: query
      required: false
      description: |
        Flow page size. `0` or omitted uses 100. Maximum 500.
        A limit above 500 is 400 `bad_range`.
      schema:
        type: integer
        minimum: 0
        maximum: 500
        default: 100
    LimitTop:
      name: limit
      in: query
      required: false
      description: |
        Maximum rows for talkers, ASNs, and reputation, and the requested path window for geo.
        `0` or omitted uses 100. Maximum 100.
        Geo paths are hard-capped at 100 (`path_cap`) even when `limit` is omitted.
        A limit above 100 is 400 `bad_range`.
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 100
  responses:
    Unauthorized:
      description: |
        The bearer token is missing or was rejected.
        Tokens are accepted only as `Authorization: Bearer`.
        The query string is not a token channel.
        This status is returned on every bind, including loopback.
    BadRange:
      description: |
        `bad_range`. The day, timezone, or range cannot be resolved,
        or a query parameter is rejected (including `limit` above the route maximum
        and a `cursor` that is not the keyset encoding).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadRange"
          example:
            error: bad_range
    BadQuery:
      description: |
        `bad_range` when a day, timezone, range, or other query parameter is rejected.
        `filter_outside_raw` when an unsupported filter is set and `start` is before
        raw retention. The route does not drop the filter and serve the rollup.
        `raw_available_from` is the oldest receive time still inside raw retention.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/BadRange"
              - $ref: "#/components/schemas/FilterOutsideRaw"
          examples:
            bad_range:
              summary: Unresolvable range, timezone, or query parameter
              value:
                error: bad_range
            filter_outside_raw:
              summary: Unsupported filter outside raw retention
              value:
                error: filter_outside_raw
                raw_available_from: "2026-11-09T06:00:00Z"
    QueryTimeout:
      description: |
        The read exceeded 5 seconds.
        The body is not partial and is not an unfiltered rollup.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QueryTimeout"
          example:
            error: query_timeout
  schemas:
    DecimalCount:
      type: string
      pattern: "^[0-9]+$"
      description: |
        Decimal integer that may exceed 2^53.
        A string, not a JSON number.
        Not multiplied by the sampling interval.
      example: "1000"
    BadRange:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [bad_range]
          description: The day, timezone, range, or query parameter was rejected.
    FilterOutsideRaw:
      type: object
      additionalProperties: false
      required: [error, raw_available_from]
      properties:
        error:
          type: string
          enum: [filter_outside_raw]
          description: An unsupported filter was set and start is before raw retention.
        raw_available_from:
          type: string
          format: date-time
          description: Oldest receive time still inside raw retention, RFC 3339 UTC.
    QueryTimeout:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [query_timeout]
          description: The read exceeded 5 seconds.
    JsonCount:
      type: integer
      minimum: 0
      description: |
        Counter encoded as a JSON number, including zero.
        The stats and exporter examples use numbers, not decimal strings.
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Stats:
      type: object
      additionalProperties: false
      description: |
        Process-lifetime counters. Every key is present, including zeros.
        Enrichment families use the suffixes `not_configured`, `no_data`, `error`,
        `value`, and `skipped`. `skipped` is non-global, not a provider failure.
      required:
        - udp_received_packets
        - udp_received_bytes
        - decoded_packets
        - decoded_flows
        - dropped_queue
        - dropped_enrich_queue
        - dropped_writer_queue
        - dropped_template
        - dropped_disk
        - malformed
        - missing_template
        - templates_withdrawn
        - withdraw_unknown
        - template_redefined
        - template_idle_expired
        - template_evicted
        - reserved_set
        - count_disagrees
        - padding_nonzero
        - sequence_gap_v5_flows
        - sequence_gap_v9_packets
        - sequence_gap_ipfix_records
        - sequence_reorder
        - sequence_duplicate
        - sequence_reset
        - sequence_unresolved
        - non_flow_records
        - timestamp_skew
        - timestamp_suspect
        - timestamp_export_fallback
        - clock_clamped
        - enrich_geoip_not_configured
        - enrich_geoip_no_data
        - enrich_geoip_error
        - enrich_geoip_value
        - enrich_geoip_skipped
        - enrich_asn_not_configured
        - enrich_asn_no_data
        - enrich_asn_error
        - enrich_asn_value
        - enrich_asn_skipped
        - enrich_reputation_not_configured
        - enrich_reputation_no_data
        - enrich_reputation_error
        - enrich_reputation_value
        - enrich_reputation_skipped
        - sqlite_write_failures
        - sqlite_rows_written
      properties:
        udp_received_packets:
          $ref: "#/components/schemas/JsonCount"
        udp_received_bytes:
          $ref: "#/components/schemas/JsonCount"
        decoded_packets:
          $ref: "#/components/schemas/JsonCount"
        decoded_flows:
          $ref: "#/components/schemas/JsonCount"
        dropped_queue:
          $ref: "#/components/schemas/JsonCount"
        dropped_enrich_queue:
          $ref: "#/components/schemas/JsonCount"
        dropped_writer_queue:
          $ref: "#/components/schemas/JsonCount"
        dropped_template:
          $ref: "#/components/schemas/JsonCount"
        dropped_disk:
          $ref: "#/components/schemas/JsonCount"
        malformed:
          $ref: "#/components/schemas/JsonCount"
        missing_template:
          $ref: "#/components/schemas/JsonCount"
        templates_withdrawn:
          $ref: "#/components/schemas/JsonCount"
        withdraw_unknown:
          $ref: "#/components/schemas/JsonCount"
        template_redefined:
          $ref: "#/components/schemas/JsonCount"
        template_idle_expired:
          $ref: "#/components/schemas/JsonCount"
        template_evicted:
          $ref: "#/components/schemas/JsonCount"
        reserved_set:
          $ref: "#/components/schemas/JsonCount"
        count_disagrees:
          $ref: "#/components/schemas/JsonCount"
        padding_nonzero:
          $ref: "#/components/schemas/JsonCount"
        sequence_gap_v5_flows:
          $ref: "#/components/schemas/JsonCount"
        sequence_gap_v9_packets:
          $ref: "#/components/schemas/JsonCount"
        sequence_gap_ipfix_records:
          $ref: "#/components/schemas/JsonCount"
        sequence_reorder:
          $ref: "#/components/schemas/JsonCount"
        sequence_duplicate:
          $ref: "#/components/schemas/JsonCount"
        sequence_reset:
          $ref: "#/components/schemas/JsonCount"
        sequence_unresolved:
          $ref: "#/components/schemas/JsonCount"
        non_flow_records:
          $ref: "#/components/schemas/JsonCount"
        timestamp_skew:
          $ref: "#/components/schemas/JsonCount"
        timestamp_suspect:
          $ref: "#/components/schemas/JsonCount"
        timestamp_export_fallback:
          $ref: "#/components/schemas/JsonCount"
        clock_clamped:
          $ref: "#/components/schemas/JsonCount"
        enrich_geoip_not_configured:
          $ref: "#/components/schemas/JsonCount"
        enrich_geoip_no_data:
          $ref: "#/components/schemas/JsonCount"
        enrich_geoip_error:
          $ref: "#/components/schemas/JsonCount"
        enrich_geoip_value:
          $ref: "#/components/schemas/JsonCount"
        enrich_geoip_skipped:
          $ref: "#/components/schemas/JsonCount"
        enrich_asn_not_configured:
          $ref: "#/components/schemas/JsonCount"
        enrich_asn_no_data:
          $ref: "#/components/schemas/JsonCount"
        enrich_asn_error:
          $ref: "#/components/schemas/JsonCount"
        enrich_asn_value:
          $ref: "#/components/schemas/JsonCount"
        enrich_asn_skipped:
          $ref: "#/components/schemas/JsonCount"
        enrich_reputation_not_configured:
          $ref: "#/components/schemas/JsonCount"
        enrich_reputation_no_data:
          $ref: "#/components/schemas/JsonCount"
        enrich_reputation_error:
          $ref: "#/components/schemas/JsonCount"
        enrich_reputation_value:
          $ref: "#/components/schemas/JsonCount"
        enrich_reputation_skipped:
          $ref: "#/components/schemas/JsonCount"
        sqlite_write_failures:
          $ref: "#/components/schemas/JsonCount"
        sqlite_rows_written:
          $ref: "#/components/schemas/JsonCount"
    Exporters:
      type: object
      additionalProperties: false
      required: [exporters]
      properties:
        exporters:
          type: array
          items:
            $ref: "#/components/schemas/Exporter"
    Exporter:
      type: object
      additionalProperties: false
      required:
        - exporter
        - domain
        - version
        - last_seen
        - packets
        - flows
        - malformed
        - missing_template
        - gap_flows
        - gap_packets
        - gap_records
      properties:
        exporter:
          type: string
          description: Exporter IP.
        domain:
          type: integer
          minimum: 0
          description: |
            NetFlow v9 source ID or IPFIX observation domain.
            0 when the header did not yield a domain.
        version:
          type: integer
          minimum: 0
          description: |
            5 is NetFlow v5, 9 is NetFlow v9, 10 is IPFIX.
            0 when the header did not yield a version.
        last_seen:
          type: string
          format: date-time
          description: Last packet time, RFC 3339 UTC.
        packets:
          $ref: "#/components/schemas/JsonCount"
        flows:
          $ref: "#/components/schemas/JsonCount"
        malformed:
          $ref: "#/components/schemas/JsonCount"
        missing_template:
          $ref: "#/components/schemas/JsonCount"
        gap_flows:
          $ref: "#/components/schemas/JsonCount"
        gap_packets:
          $ref: "#/components/schemas/JsonCount"
        gap_records:
          $ref: "#/components/schemas/JsonCount"
    Range:
      type: object
      required: [start, end, tz, boundary_adjusted]
      properties:
        start:
          type: string
          format: date-time
          description: Resolved window start, RFC 3339 UTC, inclusive.
        end:
          type: string
          format: date-time
          description: Resolved window end, RFC 3339 UTC, exclusive.
        tz:
          type: string
          description: IANA zone echoed for the query. `UTC` when the client omitted `tz`.
        boundary_adjusted:
          type: boolean
          description: |
            True when a skipped civil time was moved to the next valid instant.
    Source:
      type: string
      enum: [rollup, flows]
      description: |
        `rollup` when every active filter was native.
        `flows` when an unsupported filter was aggregated from raw flows.
    FlowPage:
      type: object
      additionalProperties: false
      required:
        - start
        - end
        - tz
        - boundary_adjusted
        - raw_available_from
        - truncated
        - flows
        - next_cursor
      properties:
        start:
          type: string
          format: date-time
          description: Query window start, not a flow's start.
        end:
          type: string
          format: date-time
          description: Query window end, not a flow's end.
        tz:
          type: string
          description: IANA zone echoed for the query.
        boundary_adjusted:
          type: boolean
          description: True when a skipped civil time was moved forward.
        raw_available_from:
          type: string
          format: date-time
          description: Oldest receive time still inside raw retention, RFC 3339 UTC.
        truncated:
          type: boolean
          description: |
            True when `start` is older than raw retention.
            `flows` is then empty. The status is still 200.
        flows:
          type: array
          items:
            $ref: "#/components/schemas/Flow"
        next_cursor:
          type: string
          description: |
            Keyset cursor for the next page, or empty when there is no next page.
            `base64.RawURLEncoding` of the ASCII bytes of `{flow_start_ms},{id}`.
    Flow:
      type: object
      additionalProperties: false
      description: |
        One stored flow. Outcome fields are the enrichment kind, not a provider record.
        Absent optional fields were not on the export, or are null when the column is null.
      required:
        - id
        - start
        - end
        - exporter
        - domain
        - version
        - src
        - dst
        - packets
        - octets
        - counter_semantics
        - octet_semantics
        - sampled
        - clock_clamped
        - src_scope
        - dst_scope
        - src_geo
        - dst_geo
        - src_asn
        - dst_asn
        - src_rep
        - dst_rep
      properties:
        id:
          type: integer
          minimum: 0
          description: Row id. The keyset cursor binds this with `flow_start_ms`.
        start:
          type: string
          format: date-time
          description: This flow's start, RFC 3339 UTC. Not the query window.
        end:
          type: string
          format: date-time
          description: This flow's end, RFC 3339 UTC.
        exporter:
          type: string
          description: Exporter IP.
        domain:
          type: integer
          minimum: 0
          description: NetFlow v9 source ID or IPFIX observation domain.
        version:
          type: integer
          enum: [5, 9, 10]
          description: 5 is NetFlow v5, 9 is NetFlow v9, 10 is IPFIX.
        src:
          type: string
          description: Source IP.
        dst:
          type: string
          description: Destination IP.
        src_port:
          type: integer
          nullable: true
          minimum: 0
          maximum: 65535
          description: Source port. Null or absent when the export did not carry it.
        dst_port:
          type: integer
          nullable: true
          minimum: 0
          maximum: 65535
          description: Destination port. Null or absent when the export did not carry it.
        proto:
          type: integer
          nullable: true
          minimum: 0
          maximum: 255
          description: IP protocol number. Null or absent when the export did not carry it.
        packets:
          $ref: "#/components/schemas/DecimalCount"
        octets:
          $ref: "#/components/schemas/DecimalCount"
        counter_semantics:
          type: string
          enum: [delta, total]
          description: |
            `delta` is an incremental counter. `total` is a running total and is not rolled up.
        octet_semantics:
          type: string
          enum: [ip, l4_payload]
          description: |
            `ip` is IP-layer octets. `l4_payload` is layer-4 payload octets and is not rolled up.
        flow_direction:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1
          description: 0 is ingress, 1 is egress. Null or absent when direction was not on the export.
        sampled:
          type: boolean
          description: True when the sampling interval N is greater than 1.
        sampling_interval:
          type: integer
          nullable: true
          minimum: 2
          description: |
            N in 1-of-N. Present when `sampled` is true.
            Null or absent when the flow is not sampled or N is unknown.
            The UI may show `octets * sampling_interval` as an estimate.
            That product is not stored and is not a response field.
        sampling_algorithm:
          type: integer
          nullable: true
          minimum: 0
          maximum: 255
          description: Raw sampling-algorithm value when the export carried one. Null or absent otherwise.
        clock_clamped:
          type: boolean
          description: True when start or end was moved into the receive-time clamp window.
        bgp_src_as:
          type: integer
          nullable: true
          minimum: 0
          maximum: 4294967295
          description: Source BGP AS from the export. Present when the export carried it.
        bgp_dst_as:
          type: integer
          nullable: true
          minimum: 0
          maximum: 4294967295
          description: Destination BGP AS from the export. Present when the export carried it.
        src_scope:
          $ref: "#/components/schemas/AddressScope"
        dst_scope:
          $ref: "#/components/schemas/AddressScope"
        src_geo:
          $ref: "#/components/schemas/Outcome"
        dst_geo:
          $ref: "#/components/schemas/Outcome"
        src_asn:
          $ref: "#/components/schemas/Outcome"
        dst_asn:
          $ref: "#/components/schemas/Outcome"
        src_rep:
          $ref: "#/components/schemas/Outcome"
        dst_rep:
          $ref: "#/components/schemas/Outcome"
    AddressScope:
      type: string
      description: Local address class. Only `global` is eligible for provider lookup.
      enum:
        - unspecified
        - loopback
        - link_local
        - multicast
        - broadcast
        - private
        - shared
        - documentation
        - benchmark
        - reserved
        - global
    Outcome:
      type: string
      description: |
        Enrichment outcome kind. `value` means a provider returned data.
        This field is that kind, not the GeoIP, ASN, or reputation record.
      enum: [not_configured, no_data, error, value, skipped]
    Timeseries:
      type: object
      additionalProperties: false
      required: [source, grain, start, end, tz, boundary_adjusted, series]
      properties:
        source:
          $ref: "#/components/schemas/Source"
        grain:
          type: string
          enum: ["1m", "1h"]
          description: |
            `1m` when the range is at most 7 days, and whenever `source` is `flows`.
            `1h` when a rollup range is longer than 7 days.
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        tz:
          type: string
        boundary_adjusted:
          type: boolean
        series:
          type: array
          minItems: 1
          maxItems: 2
          description: |
            One element per `sampled` value in the result.
            Both values when `sampled` was omitted. One value when it was set.
          items:
            $ref: "#/components/schemas/TrafficSeries"
    TrafficSeries:
      type: object
      additionalProperties: false
      required: [sampled, points]
      properties:
        sampled:
          type: boolean
        points:
          type: array
          items:
            $ref: "#/components/schemas/TrafficPoint"
    TrafficPoint:
      type: object
      additionalProperties: false
      required: [t, octets, packets]
      properties:
        t:
          type: string
          format: date-time
          description: Bucket start, RFC 3339 UTC.
        octets:
          $ref: "#/components/schemas/DecimalCount"
        packets:
          $ref: "#/components/schemas/DecimalCount"
    Talkers:
      type: object
      additionalProperties: false
      required:
        - source
        - grain
        - start
        - end
        - tz
        - boundary_adjusted
        - by
        - approximate
        - other_octets
        - rows
      properties:
        source:
          $ref: "#/components/schemas/Source"
        grain:
          type: string
          enum: ["1m"]
          description: Talker buckets are one minute.
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        tz:
          type: string
        boundary_adjusted:
          type: boolean
        by:
          type: string
          enum: [src, dst]
          description: Direction that was ranked.
        approximate:
          type: boolean
          description: True when `other_octets` is a non-zero OTHER remainder.
        other_octets:
          allOf:
            - $ref: "#/components/schemas/DecimalCount"
          description: Sum of `*` rows in the range. Does not overlap a listed address.
        rows:
          type: array
          items:
            $ref: "#/components/schemas/TalkerRow"
    TalkerRow:
      type: object
      additionalProperties: false
      required: [addr, octets, packets, flows]
      properties:
        addr:
          type: string
          description: Ranked IP. The OTHER sentinel is not a listed row.
        octets:
          $ref: "#/components/schemas/DecimalCount"
        packets:
          $ref: "#/components/schemas/DecimalCount"
        flows:
          type: integer
          minimum: 0
          description: Flow count for this address. A JSON number.
    ASNs:
      type: object
      additionalProperties: false
      required: [source, grain, start, end, tz, boundary_adjusted, rows]
      properties:
        source:
          $ref: "#/components/schemas/Source"
        grain:
          type: string
          enum: ["1m"]
          description: ASN buckets are one minute.
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        tz:
          type: string
        boundary_adjusted:
          type: boolean
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ASNRow"
    ASNRow:
      type: object
      additionalProperties: false
      required: [asn, name, direction, from_export, octets, packets, flows]
      properties:
        asn:
          type: integer
          minimum: -1
          description: Autonomous system number. `-1` is the overflow sentinel (`other`).
        name:
          type: string
          description: ASN name. Empty when no name is stored.
        direction:
          type: string
          enum: [src, dst]
        from_export:
          type: boolean
          description: |
            True when the row is the export BGP AS, used because the ASN provider
            outcome was not `value`.
        octets:
          $ref: "#/components/schemas/DecimalCount"
        packets:
          $ref: "#/components/schemas/DecimalCount"
        flows:
          type: integer
          minimum: 0
          description: Flow count. A JSON number.
    Reputation:
      type: object
      additionalProperties: false
      required:
        - source
        - grain
        - start
        - end
        - tz
        - boundary_adjusted
        - approximate
        - other_octets
        - rows
      properties:
        source:
          $ref: "#/components/schemas/Source"
        grain:
          type: string
          enum: ["1m"]
          description: Reputation buckets are one minute.
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        tz:
          type: string
        boundary_adjusted:
          type: boolean
        approximate:
          type: boolean
          description: True when `other_octets` is a non-zero OTHER remainder.
        other_octets:
          allOf:
            - $ref: "#/components/schemas/DecimalCount"
          description: |
            OTHER remainder (`addr` `*` and category `*`).
            Does not overlap a listed row.
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ReputationRow"
    ReputationRow:
      type: object
      additionalProperties: false
      required: [direction, addr, category, octets, packets, flows]
      properties:
        direction:
          type: string
          enum: [src, dst]
        addr:
          type: string
          description: Address whose reputation outcome was `value`.
        category:
          type: string
          description: Reputation category. Equality on this route, not a substring.
        octets:
          $ref: "#/components/schemas/DecimalCount"
        packets:
          $ref: "#/components/schemas/DecimalCount"
        flows:
          type: integer
          minimum: 0
          description: Flow count. A JSON number.
    Geo:
      type: object
      additionalProperties: false
      required:
        - source
        - start
        - end
        - tz
        - boundary_adjusted
        - bytes_are
        - approximate
        - countries
        - paths
        - path_cap
        - paths_omitted
        - other_octets
      properties:
        source:
          $ref: "#/components/schemas/Source"
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        tz:
          type: string
        boundary_adjusted:
          type: boolean
        bytes_are:
          type: string
          enum: [endpoint_touch]
          description: |
            Country octets count a flow once per end that has a country.
            Summing countries double-counts a flow with a country on both ends.
        approximate:
          type: boolean
          description: True when any bucket in the range has a non-zero OTHER.
        countries:
          type: array
          items:
            $ref: "#/components/schemas/GeoCountry"
        paths:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/GeoPath"
        path_cap:
          type: integer
          minimum: 0
          description: Hard cap on `paths`. The server uses 100.
        paths_omitted:
          type: integer
          minimum: 0
          description: Paths dropped by the cap and the in-memory prune.
        other_octets:
          allOf:
            - $ref: "#/components/schemas/DecimalCount"
          description: Octets dropped by the path cap and the in-memory prune.
    GeoCountry:
      type: object
      additionalProperties: false
      required: [iso_a2, iso_num, octets, packets, flows]
      properties:
        iso_a2:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2.
        iso_num:
          type: string
          pattern: "^[0-9]+$"
          description: |
            Zero-padded numeric country id, the same string as the world-geometry feature id.
            Not a JSON number, so leading zeros are kept (`016`).
        octets:
          $ref: "#/components/schemas/DecimalCount"
        packets:
          $ref: "#/components/schemas/DecimalCount"
        flows:
          $ref: "#/components/schemas/DecimalCount"
    GeoPath:
      type: object
      additionalProperties: false
      required: [src, dst, octets, packets, flows]
      properties:
        src:
          $ref: "#/components/schemas/GeoPlace"
        dst:
          $ref: "#/components/schemas/GeoPlace"
        octets:
          $ref: "#/components/schemas/DecimalCount"
        packets:
          $ref: "#/components/schemas/DecimalCount"
        flows:
          $ref: "#/components/schemas/DecimalCount"
    GeoPlace:
      type: object
      additionalProperties: false
      required: [kind, iso_a2]
      description: |
        `country` omits `lat` and `lon`.
        `city` includes `city`, `region` when present, and `lat`/`lon`.
        `coord` includes `lat` and `lon` rounded to one decimal degree.
      properties:
        kind:
          type: string
          enum: [country, city, coord]
        iso_a2:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2.
        region:
          type: string
        city:
          type: string
        lat:
          type: number
          format: double
          description: Latitude rounded to one decimal degree.
        lon:
          type: number
          format: double
          description: Longitude rounded to one decimal degree.
    TokenRequest:
      type: object
      additionalProperties: false
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token, client_credentials]
          description: Which grant is being redeemed.
        code:
          type: string
          description: Authorization code. Required when `grant_type` is `authorization_code`.
        redirect_uri:
          type: string
          format: uri
          description: |
            Must match the redirect used at `/oauth/authorize`.
            Required when `grant_type` is `authorization_code`.
        client_id:
          type: string
          description: |
            Client identifier. Required for every grant unless HTTP Basic carries it.
        client_secret:
          type: string
          description: |
            Client secret. Required when `grant_type` is `client_credentials`, and for a
            registered client on the other grants. Send it in this field or as the HTTP Basic
            password. It must match a pair stored in the database. The config file does not hold it.
        state:
          type: string
          description: |
            `state` from the authorization redirect.
            Required when the daemon minted PKCE and the verifier arrives in `vc_pkce`.
        code_verifier:
          type: string
          description: |
            PKCE verifier for a `code_challenge` the client sent to `/oauth/authorize`.
            Omit it when the daemon minted PKCE. The HttpOnly cookie `vc_pkce` carries that verifier.
        refresh_token:
          type: string
          description: |
            Opaque refresh token from a previous token response.
            Required when `grant_type` is `refresh_token`.
            Send it only to this route. It is not an access token.
        scope:
          type: string
          description: Space-delimited scopes. The only scope is `read`.
    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
          description: |
            Opaque bearer token. Send it only as `Authorization: Bearer`.
            The query string is not a token channel.
        refresh_token:
          type: string
          description: |
            Opaque refresh token. Present on authorization-code and refresh responses.
            Absent on client-credentials responses. Send it only to `POST /oauth/token`.
        token_type:
          type: string
          enum: [bearer]
          description: Always `bearer`.
        expires_in:
          type: integer
          minimum: 1
          description: Lifetime of the access token, in seconds.
        scope:
          type: string
          enum: [read]
          description: Always `read`.
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            OAuth 2.0 error code, such as `invalid_request`, `unsupported_grant_type`, or `invalid_grant`.
        error_description:
          type: string
          description: Optional human-readable detail. Not a collector error code.
